[project]
name = "cutroom"
version = "0.1.0"
description = "Agent-planned, tool-built narrated videos in 16:9 and 9:16"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Shreyas Kothakonda", email = "hello@shreyas.live" }]
dependencies = [
  "playwright>=1.50",
  "pillow",
  "numpy",
  "requests",
  "pyyaml",
]

[project.optional-dependencies]
voice = ["kokoro", "misaki[en]", "soundfile", "faster-whisper"]
api = ["anthropic"]

[project.scripts]
cutroom = "cutroom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cutroom*"]
