<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="lib/base.css">
<style>
  .photo { position: absolute; inset: 0; overflow: hidden; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(11,13,18,.55) 0%, rgba(11,13,18,.05) 35%, rgba(11,13,18,.35) 62%, rgba(11,13,18,.92) 100%); }
  .rs-stage { justify-content: flex-start; gap: calc(var(--u) * 1.8); }
  .rs-headline { font-size: calc(var(--u) * 7); max-width: 18ch; text-shadow: 0 calc(var(--u) * .4) calc(var(--u) * 3) rgba(0,0,0,.5); }
  .portrait .rs-headline { font-size: calc(var(--u) * 9.5); }
  .credit { position: absolute; right: var(--stage-x); bottom: calc(var(--h) * 0.05); font: calc(var(--u) * 1.3)/1.3 var(--mono);
    color: rgba(255,255,255,.6); max-width: 60%; text-align: right; }
  .portrait .credit { bottom: calc(var(--h) * 0.06); font-size: calc(var(--u) * 1.9); }
</style>
<script src="lib/runtime.js"></script>
<script src="../vendor/node_modules/gsap/dist/gsap.min.js"></script>
</head><body>
<div class="photo" data-qa="photo" data-layer="bg"><img alt=""></div>
<div class="shade"></div>
<div class="rs-stage">
  <div class="rs-kicker" data-qa="kicker"></div>
  <h2 class="rs-headline" data-qa="headline"></h2>
</div>
<div class="credit" data-qa="credit"></div>
<script>
  const P = RS.params;
  const $ = (s) => document.querySelector(s);
  $('.rs-kicker').textContent = P.kicker || '';
  $('.rs-headline').textContent = P.headline || '';
  $('.credit').textContent = P.credit || '';
  const img = $('.photo img');
  img.src = P.image;
  if (P.focus) img.style.objectPosition = `${P.focus[0] * 100}% ${P.focus[1] * 100}%`;
  RS.wait(img.decode());
  const words = RS.splitWords($('.rs-headline'));
  const D = RS.duration;
  const tl = RS.timeline();
  // Ken Burns: slow push in with a little drift.
  tl.fromTo(img, { scale: 1.06, xPercent: -1.5 }, { scale: 1.2, xPercent: 1.5, duration: D, ease: 'none' }, 0)
    .from('.rs-kicker', { y: 16, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.2)
    .from(words, { y: 40, opacity: 0, duration: 0.7, ease: 'power3.out', stagger: 0.06 }, 0.35)
    .from('.credit', { opacity: 0, duration: 0.6 }, 0.8);
  RS.start();
</script>
</body></html>
