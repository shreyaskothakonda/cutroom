<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="lib/base.css">
<style>
  .rs-stage { align-items: center; text-align: center; gap: calc(var(--u) * 3); }
  .rs-headline { max-width: 14ch; }
  .cta { font: 600 calc(var(--u) * 3)/1 var(--mono); color: var(--ink); background: var(--accent);
    padding: calc(var(--u) * 1.8) calc(var(--u) * 3.4); border-radius: 99px; }
  .portrait .cta { font-size: calc(var(--u) * 4); }
</style>
<script src="lib/runtime.js"></script>
<script src="../vendor/node_modules/gsap/dist/gsap.min.js"></script>
<script src="lib/ambient.js"></script>
</head><body>
<div class="rs-bg" data-qa="bg" data-layer="bg"></div>
<div class="rs-stage">
  <h2 class="rs-headline" data-qa="headline"></h2>
  <div class="cta" data-qa="cta"></div>
</div>
<script>
  const P = RS.params;
  const $ = (s) => document.querySelector(s);
  rsAmbient($('.rs-bg'));
  $('.rs-headline').textContent = P.headline || '';
  $('.cta').textContent = P.cta || '';
  if (!P.cta) $('.cta').remove();
  const words = RS.splitWords($('.rs-headline'));
  const tl = RS.timeline();
  tl.from(words, { y: 50, opacity: 0, duration: 0.8, ease: 'power4.out', stagger: 0.08 }, 0.2)
    .from('.cta', { scale: 0.8, opacity: 0, duration: 0.7, ease: 'back.out(2)' }, 0.8)
    .to('.rs-bg', { opacity: 0.4, duration: 0.6 }, Math.max(1.5, RS.duration - 0.6));
  RS.start();
</script>
</body></html>
